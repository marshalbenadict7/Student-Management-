<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Student Management System</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

/* BODY */

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.4s;
}

/* MAIN BOX */

.main-box{
    width:100%;
    max-width:950px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    transition:0.4s;
}

/* LOGO */

.logo{
    width:90px;
    height:90px;
    background:linear-gradient(45deg,#ff512f,#dd2476);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    color:white;
    font-size:40px;
}

/* PAGE */

.page{
    display:none;
}

.active{
    display:block;
}

/* CARD */

.card-box{
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    border-left:6px solid #2563eb;
}

/* INPUT */

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
}

/* BUTTON */

.btn-primary{
    background:linear-gradient(45deg,#2563eb,#06b6d4);
    border:none;
}

.btn-success{
    background:linear-gradient(45deg,#16a34a,#22c55e);
    border:none;
}

.btn-secondary{
    border:none;
}

/* RESULT */

.result-box{
    background:#e2e8f0;
    padding:20px;
    border-radius:15px;
}

/* DARK MODE */

.dark{
    background:linear-gradient(135deg,#000000,#1f1f1f,#121212);
}

.dark .main-box{
    background:#1e293b;
    color:white;
}

.dark .card-box{
    background:#334155;
    color:white;
    border-left:6px solid cyan;
}

.dark .form-control,
.dark .form-select{
    background:#0f172a;
    color:white;
    border:none;
}

.dark .form-control::placeholder{
    color:#cbd5e1;
}

.dark .result-box{
    background:#475569;
    color:white;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:10px;
        align-items:flex-start;
    }

    .main-box{
        padding:15px;
    }

}

</style>

</head>

<body>

<div class="main-box">

<!-- HEADER -->

<div class="d-flex justify-content-between align-items-center">

<div>

<h3>
🎓 Student Management System
</h3>

<p>
Frontend Project
</p>

</div>

<button
class="btn btn-dark "
onclick="darkMode()">

🌙 Dark 

</button>

</div>

<!-- PAGE 1 -->

<div class="page active" id="p1">

<div class="card-box">

<h5>
👤 Student Personal Details
</h5>

<div class="row">

<div class="col-md-6 mt-3">

<input
type="text"
id="studentId"
class="form-control"
placeholder="Student ID">

</div>

<div class="col-md-6 mt-3">

<input
type="text"
id="name"
class="form-control"
placeholder="Student Name">

</div>

<div class="col-md-6 mt-3">

<input
type="number"
id="age"
class="form-control"
placeholder="Age">

</div>

<div class="col-md-6 mt-3">

<select
id="gender"
class="form-select">

<option value="">
Select Gender
</option>

<option>
Male
</option>

<option>
Female
</option>

<option>
Other
</option>

</select>

</div>

<div class="col-md-6 mt-3">

<input
type="text"
id="mobile"
class="form-control"
placeholder="Mobile Number">

</div>

<div class="col-md-6 mt-3">

<input
type="email"
id="email"
class="form-control"
placeholder="Email">

</div>

<div class="col-md-12 mt-3">

<textarea
id="address"
class="form-control"
placeholder="Address"></textarea>

</div>

</div>

<button
class="btn btn-primary w-100 mt-4"
onclick="nextPage(1,2)">

Next →

</button>

</div>

</div>

<!-- PAGE 2 -->

<div class="page" id="p2">

<div class="card-box">

<h5>
📚 Academic Details
</h5>

<div class="row">

<div class="col-md-6 mt-3">

<select
id="course"
class="form-select">

<option>BCA</option>
<option>BSc CS</option>
<option>BCom</option>
<option>BBA</option>
<option>MCA</option>
<option>MBA</option>
<option>MSc CS</option>
<option>BE CSE</option>
<option>ME CSE</option>
<option>BA English</option>

</select>

</div>

<div class="col-md-6 mt-3">

<select
id="department"
class="form-select">

<option>Computer Science</option>
<option>Commerce</option>
<option>Management</option>
<option>Engineering</option>
<option>English</option>

</select>

</div>

<div class="col-md-6 mt-3">

<input
type="number"
id="marks"
class="form-control"
placeholder="Marks / 600">

</div>

<div class="col-md-6 mt-3">

<select
id="result"
class="form-select">

<option>PASS</option>
<option>FAIL</option>

</select>

</div>

</div>

<div class="d-flex gap-2 mt-4">

<button
class="btn btn-secondary w-50"
onclick="backPage(2,1)">

← Back

</button>

<button
class="btn btn-primary w-50"
onclick="nextPage(2,3)">

Next →

</button>

</div>

</div>

</div>

<!-- PAGE 3 -->

<div class="page" id="p3">

<div class="card-box">

<h5>
🗓 Attendance Details
</h5>

<div class="row">

<div class="col-md-6 mt-3">

<input
type="number"
id="present"
class="form-control"
placeholder="Present Days">

</div>

<div class="col-md-6 mt-3">

<input
type="number"
id="absent"
class="form-control"
placeholder="Absent Days">

</div>

</div>

<div class="d-flex gap-2 mt-4">

<button
class="btn btn-secondary w-50"
onclick="backPage(3,2)">

← Back

</button>

<button
class="btn btn-primary w-50"
onclick="nextPage(3,4)">

Next →

</button>

</div>

</div>

</div>

<!-- PAGE 4 -->

<div class="page" id="p4">

<div class="card-box">

<h5>
💰 Fees Details
</h5>

<div class="row">

<div class="col-md-6 mt-3">

<input
type="number"
id="totalFees"
class="form-control"
placeholder="Total Fees">

</div>

<div class="col-md-6 mt-3">

<input
type="number"
id="paidFees"
class="form-control"
placeholder="Paid Fees">

</div>

</div>

<div class="d-flex gap-2 mt-4">

<button
class="btn btn-secondary w-50"
onclick="backPage(4,3)">

← Back

</button>

<button
class="btn btn-success w-50"
onclick="generateReport()">

Generate Report

</button>

</div>

</div>

</div>

<!-- PAGE 5 -->

<div class="page" id="p5">

<div class="card-box">

<h5>
📊 Student Report
</h5>

<div
id="report"
class="result-box mt-3">

</div>

<div class="d-flex gap-2 mt-4">

<button
class="btn btn-primary w-50"
onclick="window.print()">

PDF Download

</button>

<button
class="btn btn-success w-50"
onclick="location.reload()">

New Student

</button>

</div>

</div>

</div>

</div>

<script>

/* PAGE */

function nextPage(current,next){

document
.getElementById("p"+current)
.classList.remove("active");

document
.getElementById("p"+next)
.classList.add("active");

}

function backPage(current,back){

document
.getElementById("p"+current)
.classList.remove("active");

document
.getElementById("p"+back)
.classList.add("active");

}

/* DARK MODE */

let dark = false;

function darkMode(){

if(dark == false){

document.body.classList.add("dark");

dark = true;

}
else{

document.body.classList.remove("dark");

dark = false;

}

}

/* REPORT */

function generateReport(){

let studentId =
document.getElementById("studentId").value;

let name =
document.getElementById("name").value;

let age =
document.getElementById("age").value;

let gender =
document.getElementById("gender").value;

let mobile =
document.getElementById("mobile").value;

let email =
document.getElementById("email").value;

let address =
document.getElementById("address").value;

let course =
document.getElementById("course").value;

let department =
document.getElementById("department").value;

let marks =
Number(document.getElementById("marks").value);

let result =
document.getElementById("result").value;

let present =
Number(document.getElementById("present").value);

let absent =
Number(document.getElementById("absent").value);

let totalFees =
Number(document.getElementById("totalFees").value);

let paidFees =
Number(document.getElementById("paidFees").value);

/* VALIDATION */

if(
studentId=="" ||
name=="" ||
age=="" ||
gender=="" ||
mobile=="" ||
email=="" ||
address==""
){

alert("Please Fill All Fields");

return;

}

/* ATTENDANCE */

let total =
present + absent;

let attendance =
(present / total) * 100;

/* BALANCE */

let balance =
totalFees - paidFees;

/* RANK */

let rank = "";

if(marks >= 500){

rank = "Gold 🥇";

}
else if(marks >= 400){

rank = "Silver 🥈";

}
else if(marks >= 300){

rank = "Bronze 🥉";

}
else{

rank = "No Rank";

}

/* SAVE */

let student = {

studentId,
name,
age,
gender,
mobile,
email,
address,
course,
department,
marks,
rank,
result,
attendance,
totalFees,
paidFees,
balance

};

let students =
JSON.parse(
localStorage.getItem("students")
) || [];

students.push(student);

localStorage.setItem(
"students",
JSON.stringify(students)
);

/* REPORT */

document.getElementById("report")
.innerHTML = `

<h4>
🎓 Student Final Report
</h4>

<hr>

<p>
🆔 Student ID :
${studentId}
</p>

<p>
👤 Name :
${name}
</p>

<p>
🎂 Age :
${age}
</p>

<p>
⚧ Gender :
${gender}
</p>

<p>
📞 Mobile :
${mobile}
</p>

<p>
📧 Email :
${email}
</p>

<p>
🏠 Address :
${address}
</p>

<p>
📚 Course :
${course}
</p>

<p>
🏢 Department :
${department}
</p>

<p>
📊 Marks :
${marks}/600
</p>

<p>
🏆 Rank :
${rank}
</p>

<p>
✅ Result :
${result}
</p>

<p>
🗓 Attendance :
${attendance.toFixed(2)}%
</p>

<p>
💰 Total Fees :
₹${totalFees}
</p>

<p>
💳 Paid Fees :
₹${paidFees}
</p>

<p>
⚠ Balance :
₹${balance}
</p>

`;

document
.getElementById("p4")
.classList.remove("active");

document
.getElementById("p5")
.classList.add("active");

}

</script>

</body>

</html>
